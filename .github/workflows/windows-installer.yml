name: Windows installer

# Builds Pokemon-ACO-Setup-<version>.exe on a Windows runner.
# Download it from the run's "Artifacts" section. Pushing a tag like v1.0.0 also
# attaches the installer to a GitHub Release.
on:
  push:
    # With only `tags` listed GitHub would skip branch pushes, so list both.
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Pokemon-ACO-Setup
          path: release/*.exe
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
