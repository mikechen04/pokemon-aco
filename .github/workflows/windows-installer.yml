name: Windows installer

# Builds Pokemon-ACO-Setup-<version>.exe on a Windows runner.
# Download it from the run's "Artifacts" section.
# Publishing a release (installed apps update themselves from these): push a tag like v1.1.0
# matching package.json, or run this workflow by hand with "Publish a GitHub Release" ticked.
# The release gets the installer, its .blockmap and latest.yml.
on:
  push:
    # With only `tags` listed GitHub would skip branch pushes, so list both.
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'catalog/feed.json', 'catalog/history.json']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release (tag v<package.json version>) from this run
        type: boolean
        default: false

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Work out the release
        id: release
        shell: bash
        env:
          PUBLISH_INPUT: ${{ inputs.release }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $tag"
              exit 1
            fi
            publish=true
          elif [ "$PUBLISH_INPUT" = "true" ]; then
            publish=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Pokemon-ACO-Setup
          path: release/*.exe
          if-no-files-found: error
      - name: Publish the release (installer + update metadata)
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pokemon ACO ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
