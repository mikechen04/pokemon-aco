name: Catalog feed

# Rebuilds catalog/feed.json (products, TCGplayer prices, store links) once a day and commits
# it. Installed apps sync their Catalog tab from that file. Runs after tcgcsv.com's daily
# refresh (~20:00 UTC). Optional secret: BESTBUY_API_KEY (free key from developer.bestbuy.com)
# lets it find Best Buy links on its own.
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

concurrency:
  group: catalog-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build the feed
        run: npm run catalog:feed
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
      - name: Commit the new feed
        run: |
          git add catalog/feed.json catalog/history.json
          if git diff --cached --quiet; then
            echo "Feed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update catalog feed ($(date -u +%Y-%m-%d))"
          git push
