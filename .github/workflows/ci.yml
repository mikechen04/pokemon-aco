name: CI

on:
  push:
    paths-ignore: ['**.md']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Type-checking, unit tests and bundling do not need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
